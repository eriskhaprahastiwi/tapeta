<style>
  .sea {position:relative;min-height:420px;overflow:hidden;border-radius:18px;background:linear-gradient(#b9e5e6 0%,#9bd4d2 30%,#258899 68%,#075b70 100%);isolation:isolate;color:#123d46}
  .sun {position:absolute;right:19%;top:12%;width:76px;height:76px;border-radius:50%;background:#f8d68f;box-shadow:0 0 0 14px #f8d68f33,0 0 55px #fff0bc99}
  .island {position:absolute;z-index:1;right:-15px;bottom:34%;width:190px;height:94px;border-radius:60% 0 0 0;background:linear-gradient(160deg,#7b9c6d,#466c59);transform:rotate(-4deg)}
  .island:before {content:"";position:absolute;width:90px;height:76px;right:45px;top:-27px;border-radius:100% 0 60% 0;background:#547b61}
  .label {position:absolute;z-index:5;top:20px;left:24px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#15515a}
  .route {position:absolute;z-index:2;width:64%;height:135px;border-top:1px dashed #fff9;border-radius:50%;transform:rotate(-10deg)}.route.a{left:8%;top:43%}.route.b{left:29%;top:53%;transform:rotate(9deg);width:55%}
  .ship {position:absolute;z-index:4;width:98px;height:98px;filter:drop-shadow(0 8px 5px #0b364044)}.ship.a{left:18%;top:28%;animation:sailA 19s ease-in-out infinite alternate}.ship.b{left:65%;top:47%;animation:sailB 22s ease-in-out infinite alternate}
  .waves {position:absolute;z-index:3;left:-3%;bottom:-2%;width:106%;height:62%;overflow:visible;pointer-events:none}
  .foam {fill:none;stroke:#e8f9ee;stroke-width:8;stroke-linecap:round;stroke-dasharray:2 13;animation:foam 9s linear infinite}
  .foam.f2 {stroke:#b4e7dd;stroke-width:5;stroke-dasharray:20 16;animation-duration:13s;animation-direction:reverse}
  .curl {transform-origin:center;animation:roll 7s ease-in-out infinite alternate}
  .curl.c2 {animation-delay:-3s;animation-duration:9s}
  @keyframes sailA{0%{translate:0 4px;rotate:-7deg}50%{translate:150px -11px;rotate:1deg}100%{translate:270px 8px;rotate:-5deg}}
  @keyframes sailB{0%{translate:0 4px;rotate:5deg}50%{translate:-80px -8px;rotate:-2deg}100%{translate:-180px 7px;rotate:4deg}}
  @keyframes foam{to{stroke-dashoffset:-160;transform:translateX(30px)}}
  @keyframes roll{to{transform:translateY(-7px) rotate(1deg)}}
  .caption{position:absolute;z-index:5;bottom:18px;left:24px;color:#e7f4ef;font-size:13px;text-shadow:0 1px 4px #075b70}
  @media(max-width:600px){.sea{min-height:340px}.ship{width:72px;height:72px}.waves{height:58%}.island{width:125px;height:70px}@keyframes sailA{0%{translate:0 4px;rotate:-7deg}50%{translate:55px -8px;rotate:1deg}100%{translate:105px 7px;rotate:-5deg}}@keyframes sailB{0%{translate:0 4px;rotate:5deg}50%{translate:-35px -7px;rotate:-2deg}100%{translate:-75px 6px;rotate:4deg}}}
</style>
