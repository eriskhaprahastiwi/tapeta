<style>
 .ukiyo{position:relative;min-height:430px;overflow:hidden;border-radius:16px;background:#efe4c9;color:#183d53;isolation:isolate;border:1px solid #dfcfad}
 .sun{position:absolute;width:116px;height:116px;border-radius:50%;background:#d88759;right:17%;top:9%;opacity:.84}
 .paper-grain{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(#7b63411c .7px,transparent .7px);background-size:6px 6px;mix-blend-mode:multiply;opacity:.45}
 .islands{position:absolute;z-index:1;right:3%;top:42%;width:30%;height:90px;fill:#75856b;stroke:#344f52;stroke-width:2}
 .wave-art{position:absolute;z-index:2;left:-3%;bottom:-6%;width:106%;height:62%;overflow:visible}
 .ink-line{fill:none;stroke:#173e68;stroke-width:3;stroke-linecap:round;stroke-dasharray:9 11;animation:inkflow 16s linear infinite}
 .foamline{fill:none;stroke:#fff3dc;stroke-width:6;stroke-linecap:round;stroke-dasharray:2 9;animation:foamflow 8s linear infinite}
 .sea-shimmer{fill:none;stroke:#78a8ad;stroke-width:2;stroke-linecap:round;stroke-dasharray:20 15;animation:inkflow 13s linear infinite reverse}
 .boat{position:absolute;z-index:4;width:118px;height:113px;filter:drop-shadow(2px 4px 1px #4a382833)}
 .boat.a{left:19%;top:30%;animation:boatA 18s ease-in-out infinite alternate}.boat.b{left:66%;top:38%;width:100px;height:96px;animation:boatB 21s ease-in-out infinite alternate}
 .path{position:absolute;z-index:3;border-top:2px dotted #48657899;border-radius:50%;height:95px;transform:rotate(-8deg)}.path.a{left:7%;top:50%;width:52%}.path.b{right:5%;top:51%;width:45%;transform:rotate(12deg)}
 .caption{position:absolute;z-index:5;left:22px;bottom:16px;font:13px Georgia,serif;letter-spacing:.04em;color:#f7edd7;text-shadow:0 1px 3px #173e68}
 .tag{position:absolute;z-index:5;top:18px;left:22px;font:11px Georgia,serif;text-transform:uppercase;letter-spacing:.18em;color:#38576a}
 @keyframes inkflow{to{stroke-dashoffset:-170;transform:translateX(12px)}}@keyframes foamflow{to{stroke-dashoffset:-100;transform:translateX(16px)}}
 @keyframes boatA{to{translate:210px -7px;rotate:3deg}}@keyframes boatB{to{translate:-130px 7px;rotate:-3deg}}
 @media(max-width:600px){.ukiyo{min-height:350px}.boat{width:88px;height:84px}.boat.b{width:76px;height:73px}.sun{width:82px;height:82px}@keyframes boatA{to{translate:95px -5px;rotate:3deg}}@keyframes boatB{to{translate:-55px 5px;rotate:-3deg}}}
</style>
